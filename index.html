<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Milo Tasks</title>
<style>
:root{--g:#1f5d3a;--g2:#e4f0e6;--b:#4a3020;--bg:#f2f6f1;--w:#fff;--m:#6d7a70}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--b);padding-bottom:76px}
@media(prefers-color-scheme:dark){:root{--g:#6fcf97;--g2:#1d2a21;--b:#eadfd5;--bg:#111612;--w:#19211b;--m:#9bab9f}}
.wrap{max-width:480px;margin:auto;padding:16px}
h1,h2{margin:0 0 8px}.card{background:var(--w);border-radius:14px;padding:16px;margin:12px 0;border:1px solid var(--g2)}
.bal{background:var(--g);color:#fff;border-radius:18px;padding:22px}.bal b{font-size:34px;display:block}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid var(--m);border-radius:10px;background:var(--w);color:var(--b);font:inherit}
button{background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer}
@media(prefers-color-scheme:dark){button,.bal,.pay{color:#0c1a10}.pay button{color:#fff}}
button.s{background:var(--g2);color:var(--b)}button:focus-visible,input:focus-visible{outline:3px solid var(--b);outline-offset:2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;background:var(--w);padding:8px;border-top:1px solid var(--g2)}
nav button{background:none;color:var(--m);flex:1;max-width:110px;padding:10px 2px;font-size:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bal .two b{font-size:22px}nav button.on{color:var(--g);background:var(--g2)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--g2)}
.pay{background:var(--g);color:#fff;border-radius:22px;padding:18px;margin:10px 0}.pay small{font-size:14px;opacity:.9;display:block}.pay h3{margin:0 0 14px;font-size:26px}.pay .no{font-size:34px;font-weight:800;letter-spacing:1px;margin:6px 0 16px;word-break:break-all}.pay button{width:100%;background:#4a3020;color:#fff;border-radius:999px;padding:14px;font-size:17px}.warn{border:1px solid #d9a441;border-radius:14px;padding:12px;margin:10px 0;font-size:14px}.warn b{color:#b9770e;display:block}.m{color:var(--m);font-size:14px}.e{color:#c0392b}.hide{display:none}
</style></head><body>
<div class="wrap" id="app"></div><nav id="nav" class="hide"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
// ====== SETTINGS ======
const SB_URL='https://famxzlanyngsyrzfidhq.supabase.co', SB_KEY='sb_publishable_xyTHdvmlPtlP0VCyADJKPA_ZOO8YG6o';
const BANK={bank:'PalmPay',name:'Veronica Dooshima Apinega (MiloTasks)',no:'8958769248'};
// =================================
const FEE=1000, sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s), N=n=>'₦'+Number(n).toLocaleString();
let me=null, tab='home', msg='';
const ref=new URLSearchParams(location.search).get('ref')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const url=u=>/^https:\/\//.test(u)?esc(u):'#';

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){me=null;return authView()}
  const {data}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  me=data;draw();
}
function authView(login){
  $('#nav').classList.add('hide');
  $('#app').innerHTML=`<h1>Milo Tasks</h1><p class="m">Activate your account, join channels, and earn ${N(50)} for each one.</p>
  <div class="card"><h2>${login?'Log in':'Create account'}</h2>
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="${login?'current-password':'new-password'}">
  <p class="e" id="er"></p><button id="go">${login?'Log in':'Create account'}</button>
  <p><button class="s" id="sw">${login?'New here? Create account':'Have an account? Log in'}</button></p></div>`;
  $('#sw').onclick=()=>authView(!login);
  $('#go').onclick=async()=>{
    const email=$('#em').value.trim(),password=$('#pw').value;
    const r=login?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password,options:{data:{ref}}});
    if(r.error)return $('#er').textContent=r.error.message;
    if(!r.data.session)return $('#er').textContent='Check your email to confirm, then log in.';
    boot();
  };
}
function draw(){
  const t=[['home','Home'],['tasks','Tasks'],['invite','Invite'],['wallet','Withdraw'],['help','Help']];
  if(me.is_admin)t.push(['admin','Admin']);
  $('#nav').classList.remove('hide');
  $('#nav').innerHTML=t.map(([k,v])=>`<button class="${tab==k?'on':''}" data-t="${k}">${v}</button>`).join('');
  $('#nav').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;msg='';draw()}};
  views[tab]();
}
const note=()=>msg?`<p class="e">${esc(msg)}</p>`:'';
const act=async(p,ok)=>{const {error}=await p;msg=error?error.message:(ok||'');await boot();};
const views={
 async home(){
  const {data:d}=await sb.from('deposits').select('*').eq('user_id',me.id).order('id',{ascending:false}).limit(1);
  const pend=d&&d[0]&&d[0].status=='pending';
  $('#app').innerHTML=`<div class="bal"><div class="two"><div><span>Task wallet</span><b>${N(me.task_bal)}</b></div><div><span>Affiliate wallet</span><b>${N(me.aff_bal)}</b></div></div><p style="margin:10px 0 0">${me.active?'Account active':'Account not active'}</p></div>${note()}`+
  (me.active?`<div class="card"><h2>You're active</h2><p>Task earnings go to your Task wallet. Referral earnings go to your Affiliate wallet.</p></div>`:
  `<div class="card"><h2>Activate with ${N(FEE)}</h2><p><b>Send ${N(FEE)} to this account</b></p>
   <div class="pay"><small>Activation account</small><h3>${esc(BANK.bank)}</h3><small>${esc(BANK.name)}</small><div class="no">${esc(BANK.no)}</div><button id="cn">Copy number</button></div>
   <div class="warn"><b>Important notice</b>Send the exact amount, then type the name of the account you paid from below. Your account is activated after the payment is confirmed.</div>
   ${pend?'<p>Your payment is waiting for approval.</p>':`<input id="sn" placeholder="Name on the account you paid from"><button id="sd">I have paid</button>`}
   <p class="m">Activation is approved by an admin after your payment is confirmed. Minimum withdrawal: ${N(10000)} from Task wallet, ${N(1000)} from Affiliate wallet.</p></div>`);
  const cn=$('#cn');if(cn)cn.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(BANK.no);cn.textContent='Copied'};
  const b=$('#sd');if(b)b.onclick=()=>act(sb.rpc('submit_deposit',{p_sender:$('#sn').value.trim()}),'Payment submitted. Wait for approval.');
 },
 async tasks(){
  const [{data:ts},{data:cs}]=await Promise.all([sb.from('tasks').select('*').order('id'),sb.from('claims').select('task_id').eq('user_id',me.id)]);
  const done=new Set((cs||[]).map(c=>c.task_id));
  $('#app').innerHTML=`<h2>Tasks</h2>${note()}`+(me.active?'':'<p class="e">Activate your account on Home to claim rewards.</p>')+
  ((ts||[]).map(t=>`<div class="card"><b>${esc(t.title)}</b><p class="m">${t.slots} slots left · earn ${N(50)}</p>
   <a href="${url(t.link)}" target="_blank" rel="noopener"><button class="s">Open channel</button></a>
   ${done.has(t.id)?'<button disabled>Claimed</button>':t.slots>0?`<button data-c="${t.id}">Claim ${N(50)}</button>`:'<button disabled>Full</button>'}</div>`).join('')||'<p class="m">No tasks right now. Check back soon.</p>');
  $('#app').onclick=e=>{if(e.target.dataset.c)act(sb.rpc('claim_task',{p_task:+e.target.dataset.c}),'Reward added.')};
 },
 invite(){
  const l=location.origin+location.pathname+'?ref='+me.ref_code;
  $('#app').innerHTML=`<h2>Invite</h2><div class="card"><p>You earn ${N(200)} in your Affiliate wallet when someone you invite activates their account.</p>
  <p class="m">Your code: <b>${esc(me.ref_code)}</b></p><input id="lk" readonly value="${esc(l)}"><button id="cp">Copy link</button></div>`;
  $('#cp').onclick=()=>{$('#lk').select();navigator.clipboard&&navigator.clipboard.writeText(l);$('#cp').textContent='Copied'};
 },
 async wallet(){
  const {data:w}=await sb.from('withdrawals').select('*').eq('user_id',me.id).order('id',{ascending:false});
  $('#app').innerHTML=`<h2>Withdraw</h2><div class="card"><div class="two"><div><span class="m">Task wallet</span><br><b>${N(me.task_bal)}</b></div><div><span class="m">Affiliate wallet</span><br><b>${N(me.aff_bal)}</b></div></div>
  <p class="m">Minimum: ${N(10000)} from Task wallet, ${N(1000)} from Affiliate wallet. Your account must be active.</p>${note()}
  <select id="wl"><option value="task">Withdraw from Task wallet</option><option value="affiliate">Withdraw from Affiliate wallet</option></select>
  <input id="am" type="number" placeholder="Amount"><input id="ac" placeholder="Bank, account name, account number">
  <button id="wd">Request withdrawal</button></div><h2>History</h2>`+
  ((w||[]).map(x=>`<div class="row"><span>${N(x.amount)} <span class="m">${esc(x.wallet)}</span></span><span class="m">${esc(x.status)}</span></div>`).join('')||'<p class="m">No withdrawals yet.</p>');
  $('#wd').onclick=()=>act(sb.rpc('request_withdraw',{p_wallet:$('#wl').value,p_amt:+$('#am').value,p_acct:$('#ac').value.trim()}),'Withdrawal requested.');
 },
 help(){
  $('#app').innerHTML=`<h2>Help Center</h2><div class="card"><p>Have a problem with a deposit, task or withdrawal? Message our support on Telegram and get a quick solution.</p>
  <a href="https://t.me/Daisymilo2" target="_blank" rel="noopener"><button>Message @Daisymilo2</button></a>
  <p class="m">Include the email you registered with.</p></div>`;
 },
 async admin(){
  const [{data:d},{data:w}]=await Promise.all([sb.from('deposits').select('*').eq('status','pending'),sb.from('withdrawals').select('*').eq('status','pending')]);
  $('#app').innerHTML=`<h2>Admin</h2>${note()}<h2>Deposits</h2>`+
  ((d||[]).map(x=>`<div class="card">${esc(x.email)}<br><span class="m">Paid from: ${esc(x.sender)}</span><br>
   <button data-d="${x.id}" data-ok="1">Approve</button> <button class="s" data-d="${x.id}">Reject</button></div>`).join('')||'<p class="m">None pending.</p>')+
  `<h2>Withdrawals</h2>`+((w||[]).map(x=>`<div class="card">${esc(x.email)} · <b>${N(x.amount)}</b> <span class="m">${esc(x.wallet)} wallet</span><br><span class="m">${esc(x.account)}</span><br>
   <button data-w="${x.id}" data-ok="1">Mark paid</button> <button class="s" data-w="${x.id}">Reject</button></div>`).join('')||'<p class="m">None pending.</p>');
  $('#app').onclick=e=>{const s=e.target.dataset,ok=!!s.ok;
   if(s.d)act(sb.rpc('approve_deposit',{p_id:+s.d,p_ok:ok}),'Done.');
   if(s.w)act(sb.rpc('settle_withdraw',{p_id:+s.w,p_paid:ok}),'Done.')};
 }
};
boot();
</script></body></html>
